<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Taha Kotil — software engineer</title>
  <desc id="description">A dark operator-console profile card for Taha Kotil, focused on production software, automation, and developer tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.58" stop-color="#10151f"/>
      <stop offset="1" stop-color="#17120b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f8fafc" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <circle cx="54" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="76" cy="46" r="6" fill="#30363d"/>
  <circle cx="98" cy="46" r="6" fill="#30363d"/>
  <text x="126" y="52" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.5">/profile/tahakotil</text>
  <text x="1090" y="52" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="end">PUBLIC BUILD LOG</text>

  <path d="M54 82H1146" stroke="#30363d"/>
  <rect x="54" y="112" width="8" height="60" rx="4" fill="url(#accent)"/>

  <text x="88" y="142" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3">ENGINEERING / SYSTEMS / DELIVERY</text>
  <text x="84" y="224" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="760" letter-spacing="-2">TAHA KOTIL</text>
  <text x="88" y="270" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">production software · automation · developer tools</text>

  <text x="1030" y="285" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.14" stroke-width="2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="210" font-weight="800" text-anchor="middle">TK</text>
  <circle cx="1028" cy="200" r="132" fill="none" stroke="#f59e0b" stroke-opacity="0.13"/>
  <circle cx="1028" cy="200" r="104" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-dasharray="5 12"/>
  <circle cx="1112" cy="128" r="5" fill="#f59e0b"/>
  <circle cx="922" cy="240" r="4" fill="#f59e0b"/>
  <path d="M1112 128L1150 98M922 240L875 270" stroke="#f59e0b" stroke-opacity="0.5"/>

  <rect x="54" y="322" width="1092" height="54" rx="12" fill="#090c12" stroke="#30363d"/>
  <text x="78" y="356" fill="#f59e0b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">$</text>
  <text x="104" y="356" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">focus --on APIs / async jobs / data systems / infrastructure</text>
  <rect x="828" y="341" width="292" height="4" rx="2" fill="#f59e0b" fill-opacity="0.12"/>
  <rect x="828" y="341" width="184" height="4" rx="2" fill="url(#accent)"/>
</svg>
