<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title description">
  <title id="title">Taha Kotil — software engineer</title>
  <desc id="description">A mobile light operator-console profile card for Taha Kotil.</desc>
  <defs>
