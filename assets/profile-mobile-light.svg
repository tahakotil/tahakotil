  <circle cx="42" cy="42" r="6" fill="#d97706"/>
  <circle cx="64" cy="42" r="6" fill="#d0d7de"/>
  <circle cx="86" cy="42" r="6" fill="#d0d7de"/>
  <text x="112" y="48" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">/profile/tahakotil</text>
  <path d="M42 76H678" stroke="#d0d7de"/>

  <text x="550" y="310" fill="#d97706" fill-opacity="0.06" stroke="#b45309" stroke-opacity="0.12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="220" font-weight="800" text-anchor="middle">TK</text>
  <circle cx="558" cy="226" r="118" fill="none" stroke="#b45309" stroke-opacity="0.13"/>

