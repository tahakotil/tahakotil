<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Taha Kotil — software engineer</title>
  <desc id="description">A light operator-console profile card for Taha Kotil, focused on production software, automation, and developer tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2328" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <circle cx="54" cy="46" r="6" fill="#d97706"/>
  <circle cx="76" cy="46" r="6" fill="#d0d7de"/>
  <circle cx="98" cy="46" r="6" fill="#d0d7de"/>
  <text x="126" y="52" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.5">/profile/tahakotil</text>
  <text x="1090" y="52" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="end">PUBLIC BUILD LOG</text>

  <path d="M54 82H1146" stroke="#d0d7de"/>
  <rect x="54" y="112" width="8" height="60" rx="4" fill="url(#accent)"/>

  <text x="88" y="142" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3">ENGINEERING / SYSTEMS / DELIVERY</text>
  <text x="84" y="224" fill="#1f2328" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="760" letter-spacing="-2">TAHA KOTIL</text>
  <text x="88" y="270" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">production software · automation · developer tools</text>

  <text x="1030" y="285" fill="#d97706" fill-opacity="0.06" stroke="#b45309" stroke-opacity="0.13" stroke-width="2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="210" font-weight="800" text-anchor="middle">TK</text>
  <circle cx="1028" cy="200" r="132" fill="none" stroke="#b45309" stroke-opacity="0.15"/>
  <circle cx="1028" cy="200" r="104" fill="none" stroke="#b45309" stroke-opacity="0.1" stroke-dasharray="5 12"/>
  <circle cx="1112" cy="128" r="5" fill="#d97706"/>
  <circle cx="922" cy="240" r="4" fill="#d97706"/>
  <path d="M1112 128L1150 98M922 240L875 270" stroke="#b45309" stroke-opacity="0.45"/>

  <rect x="54" y="322" width="1092" height="54" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="78" y="356" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">$</text>
  <text x="104" y="356" fill="#424a53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">focus --on APIs / async jobs / data systems / infrastructure</text>
  <rect x="828" y="341" width="292" height="4" rx="2" fill="#d97706" fill-opacity="0.12"/>
  <rect x="828" y="341" width="184" height="4" rx="2" fill="url(#accent)"/>
